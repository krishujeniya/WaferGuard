<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b0f19" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="60" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1280" height="640" fill="url(#bg)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="1100" cy="120" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
    <circle cx="180" cy="520" r="140" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

    <!-- Inner Border Card -->
    <rect x="32" y="32" width="1216" height="576" rx="24" fill="none" stroke="#1e293b" stroke-width="2" />

    <!-- Author Badge -->
    <g transform="translate(80, 96)">
        <text x="0" y="24" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="3">INDUSTRIAL MLOPS PIPELINE</text>
    </g>

    <!-- Title -->
    <text x="80" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-1">WaferGuard</text>

    <!-- Subtitle -->
    <text x="80" y="320" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400">Predictive Maintenance & Sensor Telemetry Anomaly Detection for Semiconductor Wafers</text>

    <!-- Maintainer Attribution -->
    <g transform="translate(80, 390)">
        <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">Engineered by <tspan fill="#f1f5f9" font-weight="600">Krish Ujeniya</tspan> (@krishujeniya)</text>
    </g>

    <!-- Feature Tags -->
    
        <g transform="translate(80, 470)">
            <rect width="87" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
            <text x="43.5" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">MLOps</text>
        </g>
        
        <g transform="translate(183, 470)">
            <rect width="65" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
            <text x="32.5" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">DVC</text>
        </g>
        
        <g transform="translate(264, 470)">
            <rect width="230" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
            <text x="115.0" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">K-Means Clustering</text>
        </g>
        
        <g transform="translate(510, 470)">
            <rect width="164" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
            <text x="82.0" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Sensor Drift</text>
        </g>
        
        <g transform="translate(690, 470)">
            <rect width="98" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
            <text x="49.0" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Docker</text>
        </g>
        
</svg>